spring.application.name=camunda-async-events

# JPA (tabelas outbox_message e processed_transaction, no mesmo H2 do Camunda)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RabbitMQ (ver docker-compose.yml)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=camunda
spring.rabbitmq.password=camunda
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
# Falha no listener nao deve reenfileirar direto: o dead-letter da fila principal
# e quem manda a mensagem pra fila de retry (ver CamundaEventListener/RabbitMQTopologyConfig).
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Topologia/retry dos eventos do Camunda no RabbitMQ
camunda.events.rabbitmq.exchange=camunda.events
camunda.events.rabbitmq.queue=camunda.events.queue
camunda.events.rabbitmq.retry-exchange=camunda.events.retry
camunda.events.rabbitmq.retry-queue=camunda.events.retry.queue
camunda.events.rabbitmq.dlq-exchange=camunda.events.dlq
camunda.events.rabbitmq.dlq-queue=camunda.events.dlq.queue
camunda.events.rabbitmq.retry-delay=10s
camunda.events.rabbitmq.max-retries=5
camunda.events.rabbitmq.relay-interval-ms=5000
camunda.events.rabbitmq.publish-confirm-timeout=5s
# Idade minima de uma linha do outbox pra a varredura agendada considera-la (ver OutboxRelay)
camunda.events.rabbitmq.relay-min-age=15s

# Actuator/Prometheus - so os endpoints necessarios pro monitoramento (ver docker/prometheus e
# docker/grafana). Sem autenticacao, de proposito: e o mesmo "modelo de arquitetura, nao pronto
# pra producao" documentado no README - exposto assim so serve pra rodar local/teste de carga.
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always
# Histograma de percentil so nos timers customizados do outbox - sem isso o Prometheus so tem
# media (soma/contagem), que esconde justamente os picos de latencia que indicam gargalo.
management.metrics.distribution.percentiles-histogram.outbox.publish.confirm=true
management.metrics.distribution.percentiles-histogram.outbox.relay.sweep=true
