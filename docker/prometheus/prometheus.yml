global:
  scrape_interval: 5s

scrape_configs:
  - job_name: camunda-async-events
    metrics_path: /actuator/prometheus
    static_configs:
      # A aplicacao roda no host (./mvnw spring-boot:run), nao neste compose - host.docker.internal
      # e o jeito do Prometheus (rodando no container) alcancar a porta 8080 do host (ver
      # extra_hosts no docker-compose.monitoring.yml).
      - targets: ["host.docker.internal:8080"]
